name: MCP manifest schema update

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Check official MCP schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Update from the latest Registry release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python architecture/update_manifest_schema.py --update
      - name: Verify pinned schema provenance
        run: python architecture/update_manifest_schema.py --verify
      - name: Open a reviewed update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/mcp-server-schema
          delete-branch: true
          author: sam123ben <samyak.rout@gmail.com>
          committer: sam123ben <samyak.rout@gmail.com>
          commit-message: "chore: update official MCP server schema"
          title: "chore: update official MCP server schema"
          body: |
            Pins the latest released MCP Registry schema and provenance.

            Quality gates must validate existing goldens before merge. Review
            compatibility and regenerate artifacts only when the schema requires it.
          labels: area/registry
