name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ADK_BASE_IMAGE: ghcr.io/tesserix/base-python-adk-3.14:20260829@sha256:5a6fd1863ed7f37f3929cc596d0ec063c3077c11713cd334f14d1df2b30ef386
  CORE_BASE_IMAGE: ghcr.io/tesserix/base-python-runtime-3.14:20260829@sha256:3854f5d9d00705b14077bf6715feb9c3bd6d1ad2e41d5594b3c09c0a74c22add
  COSIGN_VERSION: v3.1.3
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GITLEAKS_VERSION: 8.30.1
  SYFT_IMAGE: anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  UV_VERSION: "0.12.7"

jobs:
  guard:
    name: Immutable tag guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      oci_tag: ${{ steps.identity.outputs.oci_tag }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Resolve immutable release identity
        id: identity
        run: |
          uv sync --frozen
          uv run --frozen python -m release.guard \
            --tag "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"
      - name: Require a new tag commit already integrated into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "tesserix/tesserix-mcp-runtime"
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if release_error=$(gh release view \
            "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "::error::Release already exists; published bytes are immutable."
            exit 1
          fi
          case "$release_error" in
            *"release not found"*) ;;
            *)
              echo "::error::Could not prove release tag is unused."
              printf '%s\n' "$release_error"
              exit 1
              ;;
          esac

  quality:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  security:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  compatibility:
    needs: guard
    permissions:
      attestations: read
      contents: read
    uses: ./.github/workflows/compatibility.yml

  containers:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/containers.yml

  adversarial:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/release-journey.yml

  publish:
    name: Attest and stage immutable release
    needs: [guard, quality, security, compatibility, containers, adversarial]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      adk_ref: ${{ steps.references.outputs.adk_ref }}
      core_ref: ${{ steps.references.outputs.core_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install frozen release tools
        run: uv sync --frozen
      - name: Download gate-built Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: python-distributions
          path: release-assets
      - name: Verify distribution version and installability
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          report=$(uv run --frozen python architecture/check_artifacts.py release-assets)
          test "$(jq -r .version <<<"$report")" = "$VERSION"
          uv run --frozen twine check --strict release-assets/*
          uv run --frozen python architecture/smoke_install_artifacts.py \
            --offline --no-deps release-assets
      - name: Generate and compare Python artifact and dependency SBOMs
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          wheel_stage=$(mktemp -d)
          raw_lock_sbom="$RUNNER_TEMP/python-dependencies.raw.cdx.json"
          for wheel in release-assets/*.whl; do
            uv run --frozen python -m zipfile -e "$wheel" "$wheel_stage"
          done
          docker run --rm \
            --volume "$wheel_stage:/wheels:ro" \
            --volume "$PWD/release-assets:/assets" \
            "$SYFT_IMAGE" \
            "dir:/wheels" \
            --override-default-catalogers python-installed-package-cataloger \
            --select-catalogers=-file \
            --source-name tesserix-mcp-python-distributions \
            --source-version "$VERSION" \
            -o spdx-json=/assets/python-artifacts.spdx.json \
            -o cyclonedx-json=/assets/python-artifacts.cdx.json
          uv export --frozen --format cyclonedx1.5 \
            --preview-features sbom-export \
            --all-packages --all-extras --no-dev \
            --output-file "$raw_lock_sbom" >/dev/null
          uv run --frozen python -m release.sbom python \
            --source "$raw_lock_sbom" \
            --target release-assets/python-dependencies.cdx.json \
            --artifact-sbom release-assets/python-artifacts.cdx.json \
            --uv-lock uv.lock \
            --version "$VERSION" \
            --report release-assets/python-sbom-verification.json
      - name: Attest Python build provenance
        id: python_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.whl
            release-assets/*.tar.gz
      - name: Attest Python SBOM
        id: python_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.whl
            release-assets/*.tar.gz
          sbom-path: release-assets/python-dependencies.cdx.json
      - name: Install pinned Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
      - name: Authenticate to GHCR with the job token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Prove immutable image tags have never been published
        env:
          OCI_TAG: ${{ needs.guard.outputs.oci_tag }}
        run: |
          for variant in core adk; do
            reference="ghcr.io/${GITHUB_REPOSITORY}:${OCI_TAG}-${variant}"
            if inspection=$(docker buildx imagetools inspect "$reference" 2>&1); then
              echo "::error::Immutable image tag already exists: ${reference}"
              exit 1
            fi
            case "$inspection" in
              *"not found"*|*"manifest unknown"*) ;;
              *)
                echo "::error::Could not prove immutable image tag is unused."
                printf '%s\n' "$inspection"
                exit 1
                ;;
            esac
          done
      - name: Build and push core image
        id: core
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/container/core.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.guard.outputs.oci_tag }}-core
          build-args: PACKAGE_VERSION=${{ needs.guard.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.guard.outputs.oci_tag }}
          provenance: mode=max
          sbom: true
      - name: Build and push ADK image
        id: adk
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/container/adk.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.guard.outputs.oci_tag }}-adk
          build-args: PACKAGE_VERSION=${{ needs.guard.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.guard.outputs.oci_tag }}
          provenance: mode=max
          sbom: true
      - name: Record exact image references
        id: references
        env:
          ADK_DIGEST: ${{ steps.adk.outputs.digest }}
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          OCI_TAG: ${{ needs.guard.outputs.oci_tag }}
        run: |
          adk_ref="ghcr.io/${GITHUB_REPOSITORY}:${OCI_TAG}-adk@${ADK_DIGEST}"
          core_ref="ghcr.io/${GITHUB_REPOSITORY}:${OCI_TAG}-core@${CORE_DIGEST}"
          printf 'adk_ref=%s\n' "$adk_ref" >> "$GITHUB_OUTPUT"
          printf 'core_ref=%s\n' "$core_ref" >> "$GITHUB_OUTPUT"
      - name: Verify, inventory, and scan pushed images
        env:
          ADK_REF: ${{ steps.references.outputs.adk_ref }}
          CORE_REF: ${{ steps.references.outputs.core_ref }}
          OCI_TAG: ${{ needs.guard.outputs.oci_tag }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir -p artifacts/trivy-cache
          docker pull "$CORE_REF"
          docker pull "$ADK_REF"
          docker pull "$CORE_BASE_IMAGE"
          docker pull "$ADK_BASE_IMAGE"
          for reference in "$CORE_REF" "$ADK_REF"; do
            revision=$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$reference")
            image_version=$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
              "$reference")
            test "$revision" = "$SOURCE_SHA"
            test "$image_version" = "$OCI_TAG"
          done
          uv run --frozen python deploy/container/verify.py \
            --image "$CORE_REF" \
            --variant core \
            --base-image "$CORE_BASE_IMAGE" \
            --expected-sdk 2.1.1 \
            --output release-assets/core-runtime.json
          uv run --frozen python deploy/container/verify.py \
            --image "$ADK_REF" \
            --variant adk \
            --base-image "$ADK_BASE_IMAGE" \
            --expected-sdk 2.1.1 \
            --output release-assets/adk-runtime.json
          docker save --output artifacts/core-image.tar "$CORE_REF"
          docker save --output artifacts/adk-image.tar "$ADK_REF"
          docker save --output artifacts/core-base-image.tar "$CORE_BASE_IMAGE"
          docker save --output artifacts/adk-base-image.tar "$ADK_BASE_IMAGE"
          for variant in core adk; do
            case "$variant" in
              core)
                image_ref="$CORE_REF"
                base_ref="$CORE_BASE_IMAGE"
                ;;
              adk)
                image_ref="$ADK_REF"
                base_ref="$ADK_BASE_IMAGE"
                ;;
            esac
            image_digest=${image_ref##*@}
            base_digest=${base_ref##*@}
            docker run --rm \
              --volume "$PWD/artifacts:/artifacts" \
              --volume "$PWD/release-assets:/release-assets" \
              "$SYFT_IMAGE" \
              "docker-archive:/artifacts/${variant}-image.tar" \
              --select-catalogers=-file \
              --source-name "$image_ref" \
              --source-version "$image_digest" \
              -o "spdx-json=/release-assets/${variant}.spdx.json" \
              -o "cyclonedx-json=/release-assets/${variant}.cdx.json"
            docker run --rm \
              --volume "$PWD/artifacts:/artifacts" \
              --volume "$PWD/release-assets:/release-assets" \
              "$SYFT_IMAGE" \
              "docker-archive:/artifacts/${variant}-base-image.tar" \
              --select-catalogers=-file \
              --source-name "$base_ref" \
              --source-version "$base_digest" \
              -o "cyclonedx-json=/release-assets/${variant}-base.cdx.json"
            uv run --frozen python -m release.sbom image \
              --image-sbom "release-assets/${variant}.cdx.json" \
              --base-sbom "release-assets/${variant}-base.cdx.json" \
              --image "$image_ref" \
              --base-image "$base_ref" \
              --variant "$variant" \
              --version "$VERSION" \
              --report "release-assets/${variant}-sbom-verification.json"
            docker run --rm \
              --volume "$PWD/artifacts:/artifacts" \
              --volume "$PWD/release-assets:/release-assets" \
              --volume "$PWD/artifacts/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" \
              image --input "/artifacts/${variant}-image.tar" \
              --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 0 \
              --format json --output "/release-assets/${variant}-trivy.json"
            uv run --frozen python -m release.vulnerabilities \
              --report "release-assets/${variant}-trivy.json" \
              --output "release-assets/${variant}-trivy-policy.json"
          done
          rm -f \
            artifacts/core-image.tar artifacts/adk-image.tar \
            artifacts/core-base-image.tar artifacts/adk-base-image.tar
      - name: Attest core provenance
        id: core_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.core.outputs.digest }}
          push-to-registry: true
      - name: Attest core SBOM
        id: core_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.core.outputs.digest }}
          sbom-path: release-assets/core.cdx.json
          push-to-registry: true
      - name: Attest ADK provenance
        id: adk_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.adk.outputs.digest }}
          push-to-registry: true
      - name: Attest ADK SBOM
        id: adk_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.adk.outputs.digest }}
          sbom-path: release-assets/adk.cdx.json
          push-to-registry: true
      - name: Sign images and attach SBOM predicates
        env:
          ADK_REF: ${{ steps.references.outputs.adk_ref }}
          CORE_REF: ${{ steps.references.outputs.core_ref }}
        run: |
          cosign sign --yes \
            --bundle release-assets/core-signature.sigstore.json \
            "$CORE_REF"
          cosign attest --yes \
            --bundle release-assets/core-sbom.sigstore.json \
            --predicate release-assets/core.cdx.json \
            --type cyclonedx \
            "$CORE_REF"
          cosign sign --yes \
            --bundle release-assets/adk-signature.sigstore.json \
            "$ADK_REF"
          cosign attest --yes \
            --bundle release-assets/adk-sbom.sigstore.json \
            --predicate release-assets/adk.cdx.json \
            --type cyclonedx \
            "$ADK_REF"
      - name: Collect GitHub attestation bundles
        run: |
          cp "${{ steps.python_provenance.outputs.bundle-path }}" \
            release-assets/python-provenance.sigstore.json
          cp "${{ steps.python_sbom.outputs.bundle-path }}" \
            release-assets/python-sbom.sigstore.json
          cp "${{ steps.core_provenance.outputs.bundle-path }}" \
            release-assets/core-provenance.sigstore.json
          cp "${{ steps.core_sbom.outputs.bundle-path }}" \
            release-assets/core-github-sbom.sigstore.json
          cp "${{ steps.adk_provenance.outputs.bundle-path }}" \
            release-assets/adk-provenance.sigstore.json
          cp "${{ steps.adk_sbom.outputs.bundle-path }}" \
            release-assets/adk-github-sbom.sigstore.json
      - name: Make the repository-linked GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_name=${GITHUB_REPOSITORY#*/}
          gh api --method PATCH \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}" \
            -f visibility=public
      - name: Assemble immutable release evidence
        env:
          ADK_REF: ${{ steps.references.outputs.adk_ref }}
          CORE_REF: ${{ steps.references.outputs.core_ref }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          cp compatibility/support-matrix.json release-assets/support-matrix.json
          cp docs/releasing.md release-assets/releasing.md
          uv run --frozen python -m release.assemble \
            --directory release-assets \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --support-matrix compatibility/support-matrix.json \
            --image "core=${CORE_REF}" \
            --image "adk=${ADK_REF}"
      - name: Scan release assets before publication
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/gitleaks-bin" gitleaks
          export PATH="$RUNNER_TEMP/gitleaks-bin:$PATH"
          gitleaks dir release-assets --max-archive-depth 2 \
            --redact --no-banner --exit-code 1
          uv run --frozen python -c \
            'from pathlib import Path; from tesserix_mcp_testkit import scan_journey_surfaces; root = Path("release-assets"); names = ("release-manifest.json", "release-notes.md", "support-matrix.json", "core-runtime.json", "adk-runtime.json"); scan_journey_surfaces((root / name).read_bytes() for name in names)'
      - name: Retain release candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-candidate-${{ needs.guard.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          release_args=(
            --draft
            --notes-file release-assets/release-notes.md
            --repo "$GITHUB_REPOSITORY"
            --title "$TAG"
            --verify-tag
          )
          if [ "$PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* "${release_args[@]}"

  smoke:
    name: Verify staged release
    needs: [guard, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" --dir downloaded; then
              exit 0
            fi
            rm -rf downloaded
            test "$attempt" -lt 5 || exit 1
            sleep "$((attempt * 2))"
          done
      - name: Verify checksums, attestations, installs, signatures, and MCP calls
        env:
          ADK_REF: ${{ needs.publish.outputs.adk_ref }}
          CORE_REF: ${{ needs.publish.outputs.core_ref }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          (cd downloaded && sha256sum --check SHA256SUMS)
          for artifact in downloaded/*.whl downloaded/*.tar.gz; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA"
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://cyclonedx.org/bom
          done
          uv sync --frozen
          uv run --frozen python architecture/smoke_install_artifacts.py downloaded
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          for reference in "$CORE_REF" "$ADK_REF"; do
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              "$reference"
            cosign verify-attestation \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --type cyclonedx \
              "$reference"
            docker pull "$reference"
          done
          uv run --frozen python deploy/container/verify.py \
            --image "$CORE_REF" --variant core \
            --base-image "$CORE_BASE_IMAGE" --expected-sdk 2.1.1 \
            --output core-staged-smoke.json
          uv run --frozen python deploy/container/verify.py \
            --image "$ADK_REF" --variant adk \
            --base-image "$ADK_BASE_IMAGE" --expected-sdk 2.1.1 \
            --output adk-staged-smoke.json

  finalize:
    name: Publish verified release
    needs: [guard, publish, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft without a floating latest alias
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=false

  public_smoke:
    name: Verify public release channels
    needs: [guard, publish, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Download every release asset anonymously
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          mkdir -p public-assets
          release_json=$(mktemp)
          assets_json=$(mktemp)
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            --output "$release_json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          test "$(jq -r .draft "$release_json")" = "false"
          release_id=$(jq -er '.id | numbers | select(. > 0)' "$release_json")
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            --output "$assets_json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100"
          jq -e 'type == "array" and length > 0 and length <= 66' \
            "$assets_json" >/dev/null
          jq -r '.[].browser_download_url' "$assets_json" \
            | while IFS= read -r asset_url; do
                case "$asset_url" in
                  "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"*) ;;
                  *) exit 1 ;;
                esac
                curl --fail --location --silent --show-error \
                  --proto '=https' --tlsv1.2 \
                  --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
                  --remote-name --output-dir public-assets "$asset_url"
              done
      - name: Verify anonymous assets and public images
        env:
          ADK_REF: ${{ needs.publish.outputs.adk_ref }}
          CORE_REF: ${{ needs.publish.outputs.core_ref }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          retry_public_command() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              test "$attempt" -lt 5 || return 1
              sleep "$((attempt * 2))"
            done
          }
          (cd public-assets && sha256sum --check SHA256SUMS)
          for artifact in public-assets/*.whl public-assets/*.tar.gz; do
            retry_public_command gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA"
            retry_public_command gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://cyclonedx.org/bom
          done
          uv sync --frozen
          uv run --frozen python architecture/smoke_install_artifacts.py public-assets
          docker logout ghcr.io || true
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          for reference in "$CORE_REF" "$ADK_REF"; do
            retry_public_command docker pull "$reference"
            retry_public_command cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              "$reference"
            retry_public_command cosign verify-attestation \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --type cyclonedx \
              "$reference"
          done
          uv run --frozen python deploy/container/verify.py \
            --image "$CORE_REF" --variant core \
            --base-image "$CORE_BASE_IMAGE" --expected-sdk 2.1.1 \
            --output core-public-smoke.json
          uv run --frozen python deploy/container/verify.py \
            --image "$ADK_REF" --variant adk \
            --base-image "$ADK_BASE_IMAGE" --expected-sdk 2.1.1 \
            --output adk-public-smoke.json
