name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Verify the frozen environment
        run: |
          uv lock --check
          uv sync --frozen
      - name: Check formatting and lint
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
      - name: Check static types
        run: |
          uv run --frozen mypy --strict src tests
          uv run --frozen pyright src tests
      - name: Run the offline test suite
        run: uv run --frozen pytest
      - name: Verify architecture contracts
        run: |
          uv run --frozen lint-imports --config pyproject.toml --no-cache --no-logo
          uv run --frozen python architecture/check_layers.py
          uv run --frozen python architecture/check_public_api.py
          uv run --frozen python architecture/check_dependencies.py

  package:
    name: Distribution artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Build and validate distributions
        run: |
          uv sync --frozen
          uv build --clear --offline
          uv run --frozen twine check --strict dist/*
          uv run --frozen python architecture/check_artifacts.py dist
          uv run --frozen python architecture/smoke_install_artifacts.py \
            --offline --no-deps dist
      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
