name: Quality

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Authenticate private dependencies
        uses: ./.github/actions/auth-private-dependencies
        with:
          token: ${{ secrets.GO_PRIVATE_TOKEN }}
      - name: Verify the frozen environment
        run: |
          uv lock --check
          uv sync --frozen
      - name: Check formatting and lint
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
      - name: Check static types
        run: |
          uv run --frozen mypy --strict src tests release \
            packages/tesserix-mcp-manifest/src \
            packages/tesserix-mcp-manifest/tests \
            packages/tesserix-mcp-publisher/src \
            packages/tesserix-mcp-publisher/tests \
            packages/tesserix-mcp-testkit/src \
            packages/tesserix-mcp-testkit/tests \
            examples/conformance-server
          uv run --frozen pyright src tests release \
            packages/tesserix-mcp-manifest/src \
            packages/tesserix-mcp-manifest/tests \
            packages/tesserix-mcp-publisher/src \
            packages/tesserix-mcp-publisher/tests \
            packages/tesserix-mcp-testkit/src \
            packages/tesserix-mcp-testkit/tests \
            examples/conformance-server
      - name: Run the offline test suite
        run: uv run --frozen pytest
      - name: Run evaluation promotion gates
        run: uv run --frozen python benchmarks/measure_evaluation.py
      - name: Run offline reliability gates
        run: uv run --frozen python benchmarks/measure_reliability.py
      - name: Run the reusable testkit suite
        working-directory: packages/tesserix-mcp-testkit
        run: |
          uv run --project ../.. --frozen coverage run --branch \
            --source=tesserix_mcp_testkit -m pytest
          uv run --project ../.. --frozen coverage report \
            --show-missing --fail-under=90
      - name: Run the manifest compiler suite
        working-directory: packages/tesserix-mcp-manifest
        run: |
          uv run --project ../.. --frozen coverage run --branch \
            --source=tesserix_mcp_manifest -m pytest
          uv run --project ../.. --frozen coverage report \
            --show-missing --fail-under=90
      - name: Run the publisher suite
        working-directory: packages/tesserix-mcp-publisher
        run: |
          uv run --project ../.. --frozen coverage run --branch \
            --source=tesserix_mcp_publisher -m pytest
          uv run --project ../.. --frozen coverage report \
            --show-missing --fail-under=90
      - name: Run the external conformance example
        working-directory: examples/conformance-server
        run: uv run --frozen pytest
      - name: Verify architecture contracts
        run: |
          uv run --frozen lint-imports --config pyproject.toml --no-cache --no-logo
          uv run --frozen python architecture/check_layers.py
          uv run --frozen python architecture/check_public_api.py
          uv run --frozen python architecture/check_public_api.py \
            architecture/testkit-public-api.txt --package tesserix_mcp_testkit
          uv run --frozen python architecture/check_public_api.py \
            architecture/manifest-public-api.txt --package tesserix_mcp_manifest
          uv run --frozen python architecture/check_public_api.py \
            architecture/publisher-public-api.txt --package tesserix_mcp_publisher
          uv run --frozen python architecture/check_dependencies.py
      - name: Lint semantic examples and record retrieval metrics
        run: uv run --frozen python architecture/check_semantic_discovery.py

  package:
    name: Distribution artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Authenticate private dependencies
        uses: ./.github/actions/auth-private-dependencies
        with:
          token: ${{ secrets.GO_PRIVATE_TOKEN }}
      - name: Build and validate distributions
        run: |
          uv sync --frozen
          uv build --all-packages --clear --offline --no-create-gitignore
          uv run --frozen twine check --strict dist/*
          uv run --frozen python architecture/check_artifacts.py dist
          uv run --frozen python architecture/smoke_install_artifacts.py \
            --offline --no-deps dist
      - name: Install and run the published test extra offline
        run: |
          package_cache=$(mktemp -d)
          seed_env=$(mktemp -d)
          sample_env=$(mktemp -d)
          requirements=$(mktemp)
          runtime_wheel=$(find "$PWD/dist" -maxdepth 1 \
            -name 'tesserix_mcp_runtime-*.whl' -print -quit)
          testkit_wheel=$(find "$PWD/dist" -maxdepth 1 \
            -name 'tesserix_mcp_testkit-*.whl' -print -quit)
          uv export --quiet --frozen --no-dev --extra testkit \
            --no-emit-project --no-emit-workspace \
            --format requirements.txt --output-file "$requirements"
          uv venv --python 3.14 "$seed_env"
          UV_CACHE_DIR="$package_cache" uv pip install \
            --python "$seed_env/bin/python" --requirement "$requirements"
          uv venv --python 3.14 "$sample_env"
          UV_CACHE_DIR="$package_cache" uv pip install --offline \
            --python "$sample_env/bin/python" \
            --find-links "$PWD/dist" "${runtime_wheel}[testkit]" "$testkit_wheel"
          cd examples/conformance-server
          "$sample_env/bin/python" -m pytest -q
      - name: Install and probe the published publisher extra offline
        run: |
          package_cache=$(mktemp -d)
          seed_env=$(mktemp -d)
          sample_env=$(mktemp -d)
          requirements=$(mktemp)
          runtime_wheel=$(find "$PWD/dist" -maxdepth 1 \
            -name 'tesserix_mcp_runtime-*.whl' -print -quit)
          uv export --quiet --frozen --no-dev --extra publisher \
            --no-emit-project --no-emit-workspace \
            --format requirements.txt --output-file "$requirements"
          uv venv --python 3.14 "$seed_env"
          UV_CACHE_DIR="$package_cache" uv pip install \
            --python "$seed_env/bin/python" --requirement "$requirements"
          uv venv --python 3.14 "$sample_env"
          UV_CACHE_DIR="$package_cache" uv pip install --offline \
            --python "$sample_env/bin/python" --find-links "$PWD/dist" \
            "${runtime_wheel}[publisher]"
          "$sample_env/bin/tesserix-mcp-runtime" --version
          "$sample_env/bin/tesserix-mcp-publish" --help
      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
