name: Manifest registry compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/manifest-compatibility.yml"
      - "packages/tesserix-mcp-manifest/**"
      - "packages/tesserix-mcp-publisher/**"
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Official and Agentic dry-run validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Validate official server manifests without publishing
        run: |
          for server_file in packages/tesserix-mcp-manifest/tests/goldens/*/server.json; do
            go run github.com/modelcontextprotocol/registry/cmd/publisher@f52dc8525a441a3abf5fedc9912152d95af5aab1 validate "$server_file"
          done
      - name: Validate Agentic envelopes locally without registry access
        run: |
          for registry_file in packages/tesserix-mcp-manifest/tests/goldens/*/registry.json; do
            go run github.com/tesserix/agentic-registry/cmd/agentic@6921474591b6c59e89025370c310c7f85859246f validate -f "$registry_file"
          done
