version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - compatibility
    groups:
      python-runtime:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
