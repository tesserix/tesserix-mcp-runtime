[project]
name = "tesserix-mcp-conformance-example"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = ["tesserix-mcp-runtime[testkit]>=0.0.1.dev0,<1"]

[tool.uv]
package = false

[tool.uv.sources]
tesserix-mcp-runtime = { path = "../..", editable = true }
tesserix-mcp-testkit = { path = "../../packages/tesserix-mcp-testkit", editable = true }

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers --disable-socket --allow-unix-socket"
pythonpath = ["."]
testpaths = ["tests"]
