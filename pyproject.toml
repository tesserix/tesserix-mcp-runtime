[project]
name = "tesserix-mcp-runtime"
dynamic = ["version"]
description = "Reusable, policy-aware hosting for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tesserix" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "mcp>=2.1.1,<3",
  "mcp-types>=2.1.1,<3",
  "PyJWT[crypto]>=2.13,<3",
  "uvicorn>=0.52.4,<1",
]

[project.optional-dependencies]
adk = [
  "tesserix-adk @ https://github.com/tesserix/agent-development-kit/releases/download/v0.53.1/tesserix_adk-0.53.1-py3-none-any.whl#sha256=eec6afc695518971f44723e520cf43f0997110d013ce4733f8d6d30ec96b8bdb",
]

[project.scripts]
tesserix-mcp-runtime = "tesserix_mcp_runtime.__main__:main"

[dependency-groups]
dev = [
  "hypothesis==6.165.10",
  "import-linter==2.14",
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pyright==1.1.411",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-socket==0.8.1",
  "ruff==0.16.5",
  "twine==7.0.0",
  "types-jsonschema==4.26.0.20260518",
]

[project.urls]
Issues = "https://github.com/tesserix/tesserix-mcp-runtime/issues"
Repository = "https://github.com/tesserix/tesserix-mcp-runtime"

[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tesserix_mcp_runtime"]

[tool.uv]
required-version = ">=0.12,<0.13"
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "A",
  "C4",
  "SIM",
  "ASYNC",
  "RUF",
  "PGH",
  "ARG",
  "RET",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
files = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers --disable-socket --allow-unix-socket --cov --cov-report=term-missing"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/tesserix_mcp_runtime"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_package = "tesserix_mcp_runtime"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "core-does-not-depend-on-adapters"
name = "Core does not depend on adapters or integration libraries"
type = "forbidden"
source_modules = [
  "tesserix_mcp_runtime",
  "tesserix_mcp_runtime.contracts",
]
forbidden_modules = [
  "anthropic",
  "asyncpg",
  "fastapi",
  "google",
  "httpx",
  "kubernetes",
  "litellm",
  "mcp",
  "openai",
  "opentelemetry",
  "psycopg",
  "starlette",
  "temporalio",
  "tesserix_adk",
  "tesserix_mcp_runtime.adapters",
]
as_packages = false
