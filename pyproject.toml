[project]
name = "tesserix-mcp-runtime"
version = "0.1.0.dev0"
description = "Reusable, policy-aware hosting for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Tesserix" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["mcp>=2.1.1,<3"]

[dependency-groups]
dev = [
  "hypothesis==6.165.10",
  "import-linter==2.14",
  "pytest==9.0.3",
]

[project.urls]
Issues = "https://github.com/tesserix/tesserix-mcp-runtime/issues"
Repository = "https://github.com/tesserix/tesserix-mcp-runtime"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesserix_mcp_runtime"]

[tool.importlinter]
root_package = "tesserix_mcp_runtime"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "core-does-not-depend-on-adapters"
name = "Core does not depend on adapters or integration libraries"
type = "forbidden"
source_modules = [
  "tesserix_mcp_runtime",
  "tesserix_mcp_runtime.contracts",
]
forbidden_modules = [
  "anthropic",
  "asyncpg",
  "fastapi",
  "google",
  "httpx",
  "kubernetes",
  "litellm",
  "mcp",
  "openai",
  "opentelemetry",
  "psycopg",
  "starlette",
  "temporalio",
  "tesserix_adk",
  "tesserix_mcp_runtime.adapters",
]
as_packages = false
