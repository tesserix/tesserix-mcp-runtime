[project]
name = "tesserix-mcp-testkit"
dynamic = ["version"]
description = "Reusable conformance, fault, security, and evaluation kit for Tesserix MCP runtimes."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tesserix" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pytest",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=50,<51",
  "httpx2>=2.12,<3",
  "mcp>=2.1.1,<3",
  "pydantic>=2.13,<3",
  "pytest-socket>=0.8,<1",
  "pytest>=9,<10",
  "tesserix-mcp-runtime>=0.0.1.dev0,<1",
]

[project.entry-points.pytest11]
tesserix_mcp_testkit = "tesserix_mcp_testkit.pytest_plugin"

[project.urls]
Issues = "https://github.com/tesserix/tesserix-mcp-runtime/issues"
Repository = "https://github.com/tesserix/tesserix-mcp-runtime"

[build-system]
requires = ["hatch-vcs==0.5.0", "hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["src/tesserix_mcp_testkit"]

[tool.uv.sources]
tesserix-mcp-runtime = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers --disable-socket --allow-unix-socket"
testpaths = ["tests"]
